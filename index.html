<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5303f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Sarabun:wght@400;600&display=swap">
<title>ดึงชื่อคลิปและชื่อช่อง YouTube</title>
<style>
:root{--bg:#f4f1f3;--card:#fff;--text:#1d1a22;--muted:#6e6877;--line:#e2dce6;--accent:#e5303f;--accent2:#ff7a45;--ok:#1a7f4b;--field:#f4f1f3;--shadow:0 10px 30px -12px rgba(60,20,40,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#14101a;--card:#1e1927;--text:#f3eef7;--muted:#a69db3;--line:#322a40;--accent:#ff4d5e;--accent2:#ff9a5c;--ok:#4cc38a;--field:#14101a;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.6;padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{flex:none;width:52px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 8px 18px -6px var(--accent)}
.logo::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
h1{font:700 1.3rem/1.25 "Prompt","Sarabun",sans-serif;margin:0}
p.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
label{font:600 .95rem "Prompt","Sarabun",sans-serif;display:block;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--field);color:var(--text);transition:border-color .2s}
input:focus{border-color:var(--accent);outline:none}
button{font:inherit;cursor:pointer;border-radius:12px;border:0;padding:10px 16px;transition:transform .15s,opacity .2s}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{background:var(--field);border:1.5px solid var(--line);color:var(--text);padding:0 14px;font-size:.9rem}
.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:600 1rem "Prompt","Sarabun",sans-serif;width:100%;margin-top:12px;padding:14px;box-shadow:0 10px 20px -10px var(--accent)}
.go:disabled{opacity:.7;cursor:progress}
.bar{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.loading .bar{animation:load 1.6s ease-out forwards}
@keyframes load{0%{width:0}60%{width:70%}100%{width:92%}}
#msg{color:var(--accent);margin-top:10px;font-size:.92rem}
#msg:empty{display:none}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 45%)}
.k{color:var(--muted);font-size:.85rem}
.v{font-size:1.05rem;word-break:break-word;margin-top:2px}
.copy{background:var(--field);border:1.5px solid var(--line);color:var(--text);padding:8px 14px;margin-top:10px;font-size:.9rem}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.both{background:var(--text);color:var(--bg);font-weight:600;width:100%;padding:13px}
.hidden{display:none}
#out:not(.hidden) .card{animation:up .35s ease-out both}
#out:not(.hidden) .card:nth-child(2){animation-delay:.06s}
#out:not(.hidden) .card:nth-child(3){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo" aria-hidden="true"></div>
  <div>
    <h1>ดึงชื่อคลิปและชื่อช่อง YouTube</h1>
    <p class="sub">วางลิงก์ แล้วคัดลอกไปใช้ต่อได้เลย</p>
  </div>
</header>

<div class="card" id="form">
  <div class="bar"></div>
  <label for="url">ลิงก์ YouTube</label>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=...">
    <button class="ghost" id="paste" type="button">วาง</button>
  </div>
  <button class="go" id="go">ดูข้อมูลคลิป</button>
  <div id="msg" role="alert"></div>
</div>

<div id="out" class="hidden">
  <div class="card">
    <div class="thumb" id="thumbBox"><img id="thumb" alt="ภาพปกคลิป"></div>
    <div class="k">ชื่อคลิป</div>
    <div class="v" id="title"></div>
    <button class="copy" data-t="title">คัดลอกชื่อคลิป</button>
  </div>
  <div class="card">
    <div class="k">ชื่อช่อง</div>
    <div class="v" id="channel"></div>
    <button class="copy" data-t="channel">คัดลอกชื่อช่อง</button>
  </div>
  <button class="both" id="both">คัดลอกทั้งสองอย่าง</button>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const sources = u => [
  "https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(u),
  "https://noembed.com/embed?url=" + encodeURIComponent(u)
];
const videoId = u => (u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];

async function lookup(u){
  for (const s of sources(u)){
    try{
      const r = await fetch(s);
      if(!r.ok) continue;
      const d = await r.json();
      if(d.title) return {title:d.title, channel:d.author_name};
    }catch(e){}
  }
  return null;
}

$("paste").addEventListener("click", async () => {
  try{ $("url").value = await navigator.clipboard.readText(); $("url").focus(); }
  catch(e){ $("msg").textContent = "วางอัตโนมัติไม่ได้ ลองกดค้างที่ช่องแล้วเลือกวาง"; }
});

$("go").addEventListener("click", async () => {
  const u = $("url").value.trim();
  $("msg").textContent = "";
  $("out").classList.add("hidden");
  if(!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u)){
    $("msg").textContent = "กรุณาวางลิงก์ YouTube ที่ขึ้นต้นด้วย https://";
    return;
  }
  $("go").disabled = true; $("go").textContent = "กำลังดึงข้อมูล...";
  $("form").classList.remove("loading"); void $("form").offsetWidth; $("form").classList.add("loading");
  const info = await lookup(u);
  $("go").disabled = false; $("go").textContent = "ดูข้อมูลคลิป";
  $("form").classList.remove("loading");
  if(!info){
    $("msg").textContent = "ดึงข้อมูลไม่สำเร็จ ลองตรวจลิงก์ หรือคลิปอาจตั้งเป็นส่วนตัว";
    return;
  }
  $("title").textContent = info.title;
  $("channel").textContent = info.channel;
  const id = videoId(u);
  $("thumbBox").classList.toggle("hidden", !id);
  if(id){ $("thumb").onerror = () => $("thumbBox").classList.add("hidden"); $("thumb").src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; }
  $("out").classList.remove("hidden");
  $("out").scrollIntoView({behavior:"smooth", block:"nearest"});
});

async function copy(text, btn){
  const old = btn.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent = "คัดลอกแล้ว ✓"; btn.classList.add("done"); }
  catch(e){ btn.textContent = "คัดลอกไม่ได้ ลองกดค้างที่ข้อความ"; }
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}
document.querySelectorAll("[data-t]").forEach(b =>
  b.addEventListener("click", () => copy($(b.dataset.t).textContent, b)));
$("both").addEventListener("click", e =>
  copy($("title").textContent + " - " + $("channel").textContent, e.target));
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
